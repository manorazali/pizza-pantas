<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pizza Pantas — Game Matematik Tingkatan 1</title>
<meta name="description" content="Game restoran pizza yang pantas untuk Matematik Tingkatan 1 (KSSM): 13 bab ikut DSKP, log masuk atau tetamu, dan ringkasan skor setiap bab.">
<meta name="theme-color" content="#fff4e0">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%23f5c16c' stroke='%23d9822b' stroke-width='3'/%3E%3Ccircle cx='11' cy='12' r='3' fill='%23c0392b'/%3E%3Ccircle cx='20' cy='19' r='3' fill='%23c0392b'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Nunito:wght@600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">

  <section id="auth" class="screen hidden"></section>
  <section id="home" class="screen hidden"></section>

  <section id="game" class="screen hidden">
    <div class="hud">
      <div class="hud-i"><small>Bab</small><b id="hCh">1</b></div>
      <div class="hud-i wide"><small>Wang / Sasaran</small><b><span id="hMoney">0</span> / <span id="hGoal">0</span></b><i class="goalbar"><u id="hBar"></u></i></div>
      <div class="hud-i"><small>Masa</small><b id="hTime">0</b></div>
      <div class="hud-i"><small>Hati</small><b id="hHearts">♥♥♥</b></div>
      <div class="hud-i"><small>Combo</small><b id="hCombo">×1</b></div>
      <button id="pauseBtn" class="icon-btn" aria-label="Jeda">⏸</button>
      <button id="muteBtn" class="icon-btn" aria-label="Bunyi">🔊</button>
    </div>
    <div id="seats" class="seats"></div>
    <div id="work" class="work"></div>
    <div id="ovens" class="ovens"></div>
    <div id="pauseOv" class="overlay hidden">
      <div class="ov-card"><h2>Dijeda</h2><button class="btn pri" id="resumeBtn">Sambung</button><button class="btn" id="quitBtn">Keluar ke menu</button></div>
    </div>
  </section>

  <section id="result" class="screen hidden"></section>
  <section id="summary" class="screen hidden"></section>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
</div>
<script src="config.js"></script>
<script src="syllabus.js"></script>
<script src="api.js"></script>
<script src="game.js"></script>
</body>
</html>
